services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: qdrant
    ports:
      - "6335:6333"  # REST API (host:container)
      - "6336:6334"  # gRPC API (host:container)
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    # Data is mmap'd; the kernel happily fills GBs of page cache without a cap.
    mem_limit: 1g
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

volumes:
  qdrant_storage:
    driver: local
